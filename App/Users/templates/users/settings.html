{% extends "base.html" %}

{% block head %}
{% endblock %}

{% block content %}

<!-- Settings Content -->
<!-- <div class="p-6 pt-2">
  <h2 class="text-2xl font-medium text-gray-800 mt-1">Settings</h2>
  <p>Manage your account settings here.</p>
</div> -->

<div class="container p-5 bg-white w-full mx-auto overflow-y-scroll h-[85vh] pb-10">
  <form action="/users/profile_settings" method="POST" enctype="multipart/form-data" class="p-6">

    <!-- Profile Photo -->
    <div class="flex items-center space-x-6">
      <img src="data:image/png;base64,{{ current_user.User_ProfilePhoto() }}" alt="{{ current_user.name }}"
        class="w-20 h-20 rounded-full object-cover">

      <div>
        <label class="block text-sm font-medium text-gray-700">
          Change Profile Photo
        </label>
        <input type="file" name="profile-photo" class="mt-2 block w-full text-sm text-gray-500
                             file:mr-4 file:py-2 file:px-4
                             file:rounded-md file:border-0
                             file:text-sm file:font-semibold
                             file:bg-blue-50 file:text-blue-700
                             hover:file:bg-blue-100">
      </div>
    </div>
    <hr class="my-3">
    <!-- Form Fields -->

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-6">
      <!-- Example Form Field -->
      <div>
        <label class="block text-sm font-medium text-gray-700">
          Username
        </label>
        <input type="text" name="username" value="{{ current_user.username }}"
          class="mt-1 w-full border rounded-md p-2 focus:ring-2 focus:ring-blue-500" required>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">
          Email
        </label>
        <input type="email" name="email" value="{{ current_user.email }}"
          class="mt-1 w-full border rounded-md p-2 focus:ring-2 focus:ring-blue-500" required>
      </div>
    </div>

    <!-- Phone number -->
    <div class="mt-6 mb-3">
      <label class="block text-sm font-medium text-gray-700">
        Phone Number
      </label>
      <input type="text" name="phone-number" value="{{ current_user.phone_number }}"
        class="mt-1 w-full border rounded-md p-2 focus:ring-2 focus:ring-blue-500" required>
    </div>

    <div class="block">
      <h2 class="mx-2 mt-5 text-lg font-medium">Your Location</h2>
      <p class="text-md text-gray-500 mx-2 mt-1"><i class="fa-solid fa-location-dot"></i> {{ current_location.city }}, {{ current_location.country }}</p>
    </div>
    <hr class="mt-5 mb-3">

    <div class="flex justify-end mt-6">
      <button type="submit" disabled  class="disabled:bg-gray-400 text-sm bg-blue-400 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded">
        Save Changes
      </button>

      <a href="/users/dashboard?id={{ current_user.id }}" class="mx-5 text-sm bg-gray-300 hover:bg-gray-400 text-gray-700 font-medium py-2 px-4 rounded">
        Cancel
      </a>
      <!-- Success Modal -->
     
    </div>
  </form>

</div>
{% endblock %}

{% block scripts %}
<script>

  const form = document.querySelector('form');
  const submitButton = document.querySelector('button[type="submit"]');
  const inputs = form.querySelectorAll('input');

  function enableButton() {
    submitButton.disabled = false;
  }

  inputs.forEach(input => {
    input.addEventListener('click', enableButton);
    input.addEventListener('keyup', enableButton);
    input.addEventListener('keydown', enableButton);
  });
</script>
{% endblock %}
