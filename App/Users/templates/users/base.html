<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('users.static', filename='css/base.css')}}"
    />
    {% block head %} {% endblock %}
    <title></title>
  </head>
  <body>
    <!-- Navbar on the page. -->
    <nav class="bg-dark text-light" id="Navbar">
      <a href="/users/dashboard?id={{ current_user.id }}" id="brand-logo">
        <img
          src="{{ url_for('users.static', filename='images/brand-logo.png')}}"
          alt=""
        />
        <span class="mx-2">Fix<strong>Point</strong></span>
      </a>

      <div id="navbarMenu" class="text-light">
        <ul class="navbar-menu text-light">
          <li class="nav-item"><a href="/users/dashboard?id={{ current_user.id }}"><i class="fa-solid fa-house"></i> Home</a></li>
          <li class="nav-item"><a href="/users/history?id={{ current_user.id }}"><i class="fa-solid fa-clock-rotate-left"></i> History</a></li>
          <li class="nav-item"><a href="/users/settings?id={{ current_user.id }}"><i class="fa-solid fa-gear"></i> Settings</a></li>
          <li class="nav-item text-danger"><a  class="text-danger" style="color: red;" href="/logout"><i class="fa-solid fa-right-from-bracket"></i> Logout</a></li>
        </ul>
      </div>

      <div id="profile">
        <img class="profile-icon" src="data:image/png;base64, {{ current_user.Display_UserProfilePhoto() }}" alt="{{ current_user.username }}"></img>
        <span>{{ current_user.username }}</span>
        <button class="btn toggler-btn " id="toggleBtn">
          <i class="bi bi-list"></i>
        </button>
      </div>
    </nav>

    <!-- other templates are going to inherit from this -->
    {% block content %} {% endblock %}
    <script src="{{ url_for('users.static', filename='js/base.js')}}"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
    {% block scripts %}
    {% endblock %}
  </body>
</html>
