<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title></title>
</head>

<body class="bg-white">

    <!-- Resetting Password -->
    <img class="block size-20 mt-20 mb-2.5 mx-auto" src="{{ url_for('users.static', filename='images/brand-logo.png') }}" alt="Logo">
    <div
        class="container block mx-auto bg-blue-50 py-7 px-5 w-[90%] md:mx-auto md:w-2/5 lg:w-2/5 lg:mx-auto text-gray-700">
        <h3 class="text-xl font-medium p-1.5">Reset Password</h3>
        <p class="px-1.5 text-sm">Please enter your new password below.</p>
        <hr class="my-1.5">

        <!-- Form reseting the password -->
        <form action="/users/reset_password?id={{ current_user.id }}" method="POST" class="py-5 px-1.5">
            <div class="mb-4 relative">
                <label for="new_password" class="block text-sm font-medium mb-1">New Password</label>
                <input type="password" id="new_password" name="new_password" required
                    class="w-full px-3 py-1 border border-gray-300 rounded focus:outline-none">
                <p class="absolute top-7 right-5 cursor-pointer" onclick="togglePassword('new_password', this)"><i
                        class="fa-solid fa-eye"></i></p>
                <p class="text-xs text-gray-500 px-1 pt-1 hidden">must be at least 8 characters long</p>
            </div>
            <div class="mb-4">
                <label for="confirm_password" class="block text-sm font-medium mb-1">Confirm New Password</label>
                <input type="password" id="confirm_password" name="confirm_password" required
                    class="w-full px-3 py-1 border border-gray-300 rounded focus:outline-none">
            </div>
            <button type="submit" disabled id="submitButton"
                class="w-full bg-blue-400 disabled:bg-gray-400 text-white py-2 rounded-md hover:bg-blue-600 transition duration-200">Reset
                Password</button>
        </form>

    </div>

    <script>
        const new_passwordInput = document.getElementById('new_password');
        const confirm_passwordInput = document.getElementById('confirm_password');
        const submitButton = document.getElementById('submitButton');

        function togglePassword(inputId, iconElement) {
            const input = document.getElementById(inputId);
            const icon = iconElement.querySelector('i');

            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        new_passwordInput.addEventListener('keyup', () => {
            const errorMessage = new_passwordInput.nextElementSibling.nextElementSibling;
            if (new_passwordInput.value.length < 8) {
                errorMessage.classList.remove('hidden');
                new_passwordInput.classList.add('border-red-500');
            } else {
                new_passwordInput.classList.remove('border-red-500');
                new_passwordInput.classList.add('border-green-300');
                errorMessage.classList.add('hidden');
            }
        });

        confirm_passwordInput.addEventListener('keyup', () => {
            if (confirm_passwordInput.value !== new_passwordInput.value) {
                confirm_passwordInput.classList.add('border-red-500');
                confirm_passwordInput.classList.remove('border-green-300');
            } else {
                confirm_passwordInput.classList.remove('border-red-500');
                confirm_passwordInput.classList.add('border-green-300');
                submitButton.disabled = false;
            }
        });

    </script>
</body>

</html>
