<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="/App/static/fontawesome-free-6.7.2-web/fontawesome-free-6.7.2-web/css/all.css">
  <link rel="stylesheet" href="{{ url_for('admin.static', filename='css/base.css') }}">
  {{ moment.include_moment() }}
  {% block head %} {% endblock %}
</head>

<body>

  <!-- Toggle Button -->
  <button class="toggle-btn" id="toggleSidebar">
    <i class="bi bi-list"></i>
  </button>

  <!-- Sidebar -->
  <div id="sidebar" class="sidebar">
    <div class="sidebar-header">
      <img src="{{ url_for('users.static', filename = 'images/brand-logo.png')}}" alt="">
      <h3>Fix<strong> Point</strong></h3>
    </div>
    <a href="/admin/" class="active"><i class="bi bi-speedometer2 me-2"></i><span>Dashboard</span></a>
    <a href="/admin/users/"><i class="bi bi-people-fill me-2"></i><span> Users</span></a>
    <a href="/admin/bookings/"><i class="bi bi-calendar-event me-2"></i><span> Bookings</span></a>
    <a href="/admin/profiles/"><i class="bi bi-tools me-2"></i><span> Profiles</span></a>
    <a href="/logout"><i class="bi bi-box-arrow-right me-2"></i><span>Logout</span></a>
  </div>

  <!-- Content -->
  <div id="content" class="">
    {% block content %}{% endblock %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('admin.static', filename='js/base.js') }}"></script>
  {% block script %}{% endblock %}
</body>

</html>
