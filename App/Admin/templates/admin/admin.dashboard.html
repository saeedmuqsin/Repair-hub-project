{% extends 'admin.base.html' %}

{% block head %}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
    .top_nav {
        padding: 10px;
        display: flex;
        align-items: center;
        justify-content: space-between;

        h3 {
            font-size: 1.5rem;
            margin: 0px 10px;
        }

        .profile {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .profile i {
            font-size: 1.2rem;
            padding: 3px 7px;
            border-radius: 10px;
            background-color: rgba(233, 230, 230, 0.479);
            margin: 0px 7px;
        }

        .profile p {
            padding-top: 0px;
            font-weight: 600;
            margin: 0 3px;
        }
    }

    .card-stat {
        border-radius: 10px;
        padding: 20px;
        transition: transform 0.2s;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        background: #ffffff;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    .card-stat svg {
        height: 69px;
        background-color: blue;
        padding: 0px 20px;
        border-radius: 10px;
        width: 69px;
        margin-top: -10px;
    }

    .card-stat p {
        font-size: 2rem;
        font-weight: 600;
        margin-top: -7px;
    }

    .card-stat:hover {
        transform: translateY(-5px);
    }

    .card-icon {
        font-size: 2.5rem;
        margin-bottom: 10px;
    }

    .stats-board,
    .profile-board {
        padding: 20px;
        width: 100%;
        border-radius: 10px;
        background-color: #ffffff;
    }
</style>
{% endblock %}

{% block content %}
<div class="top_nav">
    <h3>Welcome Admin!</h3>

    <div class="profile">
        <i class="bi bi-bell-fill"></i>
        <i class="bi bi-person-fill "></i>
        <p>Admin</p>
    </div>
</div>

<!-- card for total users, total booking,  -->

<div class="row g-6">
    <div class="col-lg-6">
        <div class="stats-board">
            <h5 class="mb-3"><span><i class="bi bi-activity"></i> </span>Daily Overview</h5>
            <canvas id="barChart"></canvas>
        </div>

    </div>

    <div class="col-lg-6">
        <div class="profile-board">
             <h5 class="mb-3"><span><i class="bi bi-tools"></i> </span>Top Profiles</h5>
        </div>
    </div>


</div>

{% endblock %}

{% block script %}
<script>
    const ctx = document.getElementById('barChart').getContext('2d');
    const barChart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: ['Users', 'Bookings', 'Profiles'],
            datasets: [{
                label: 'Daily Data',
                data: [3,20, 0],
                backgroundColor: [
                    'rgba(255, 99, 132, 0.2)',
                    'rgba(54, 162, 235, 0.2)',
                    'rgba(255, 206, 86, 0.2)',
                    'rgba(75, 192, 192, 0.2)',
                    'rgba(153, 102, 255, 0.2)',
                    'rgba(255, 159, 64, 0.2)'
                ],
                borderColor: [
                    'rgba(255, 99, 132, 1)',
                    'rgba(54, 162, 235, 1)',
                    'rgba(255, 206, 86, 1)',
                    'rgba(75, 192, 192, 1)',
                    'rgba(153, 102, 255, 1)',
                    'rgba(255, 159, 64, 1)'
                ],
                borderWidth: 2
            }]
        },
        options: {
            scales: {
                x: {
                    grid: {
                        display: false // Removes vertical grid lines
                    }
                },
                y: {
                    grid: {
                        display: false // Removes horizontal grid lines
                    }
                }
            },

            responsive: true,
            plugins: {
                legend: {
                    position: 'top',
                },
                title: {
                    display: false,
                    text: 'Daily Statistic Overview',
                    font: {
                        size: 16,
                        weight: 'bold'
                    }
                }
            }
        },
    });
</script>
{% endblock %}
