<div class="container bg-white p-5 w-1/2 mx-2 rounded-lg shadow h-[400px] overflow-y-scroll">
    <h3 class="text-lg font-semibold text-gray-700 mb-4">Top 10 Brands by Bookings</h3>
    <div id="rankingsContainer" class="space-y-3">
        <div class="text-center text-gray-500">Loading...</div>
    </div>
</div>

<script>
    // Fetch top brands data
    fetch('/admin/top-brands')
        .then(response => response.json())
        .then(data => {
            const container = document.getElementById('rankingsContainer');
            container.innerHTML = ''; // Clear loading message
            
            if (data.brands.length === 0) {
                container.innerHTML = '<div class="text-center text-gray-500 py-4">No brands found</div>';
                return;
            }
            
            data.brands.forEach((brand, index) => {
                const brandHTML = `
                    <div class="flex items-center justify-between p-3 border border-gray-200 rounded-lg hover:bg-gray-50 transition">
                        <div class="flex items-center space-x-3 flex-1">
                            <div class="text-lg font-bold text-blue-500 w-8 text-center">#${index + 1}</div>
                            <img src="data:image/png;base64,${brand.photo}" alt="${brand.name}" class="w-12 h-12 rounded-full object-cover" />
                            <div>
                                <p class="font-medium text-gray-800">${brand.name}</p>
                                <p class="text-xs text-gray-500">Brand ID: ${brand.id.substring(0, 8)}...</p>
                            </div>
                        </div>
                        <div class="text-right">
                            <p class="text-2xl font-bold text-blue-600">${brand.booking_count}</p>
                            <p class="text-xs text-gray-500">bookings</p>
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', brandHTML);
            });
        })
        .catch(error => {
            console.error('Error fetching brands:', error);
            document.getElementById('rankingsContainer').innerHTML = '<div class="text-center text-red-500 py-4">Error loading data</div>';
        });
</script>
