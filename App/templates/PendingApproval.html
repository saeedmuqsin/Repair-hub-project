<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>

    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <style>
      /* Clock rotation animation */
      @keyframes spinSlow {
        from {
          transform: rotate(0deg);
        }

        to {
          transform: rotate(360deg);
        }
      }

      .clock-animate {
        animation: spinSlow 3s linear infinite;
      }

      /* Fade-in animation */
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .fade-in {
        animation: fadeIn 0.8s ease-out;
      }
    </style>
  </head>

  <body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <!-- Card -->
    <div
      class="bg-white shadow-lg rounded-xl p-8 text-center max-w-md w-full fade-in"
    >
      <!-- Animated Clock Icon -->
      <div class="text-blue-400 text-5xl mb-4">
        <i class="fa-solid fa-clock clock-animate"></i>
      </div>

      <!-- Message -->
      <h2 class="text-xl font-semibold text-gray-800 mb-2">
        Profile Pending Approval
      </h2>

      <p class="text-gray-600 text-sm mb-4">
        Your profile has been successfully created.
      </p>

      <p class="text-gray-500 text-sm">
        Please wait within
        <span class="font-semibold text-gray-700">24 hours</span>
        for approval by the admin.
      </p>

      <!-- Status Badge -->
      <div class="mt-6">
        <a
          href="/auth/login"
          class="bg-blue-400 text-white px-4 py-2 rounded-full text-sm font-medium"
        >
          Go back to login
        </a>
      </div>
    </div>
  </body>
</html>
