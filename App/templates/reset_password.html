<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <title></title>
  </head>
  <body class="bg-gray-200">

    <!-- Password Reset  -->
    <div class="container w-2/5 bg-white px-3 py-6 mx-auto mt-25">
        <h2 class="mx-2 text-xl font-medium">Change Passsword</h2>
        <hr class="my-2">

        <form action="/reset_password/{{ token }}" method="POST" id="change-password-form">
            <div class="block mt-5 mb-2.5 w-full">
                <label for="email" class="block mx-2 text-sm font-medium text-gray-700">New Password: </label>
                <input id="new_password" type="password" name="new_password" required  class="block mx-1 my-1.5 w-full rounded-md bg-white/5 px-3 py-1.5 text-base text-black outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-500 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-500 sm:text-sm/6" placeholder="Type your new password here."/>
                <p class="text-xs mx-2 text-red-500 hidden" id="newPasswordError">Password must be at least 8 characters long.</p>
            </div>
            
            <div class="block mt-5 mb-2.5 w-full relative">
                <label for="email" class="block mx-2 text-sm font-medium text-gray-700">Confirm Password: </label>
                <input id="confirm_password" type="password" name="confirm_password" required  class="block mx-1 my-1.5 w-full rounded-md bg-white/5 px-3 py-1.5 text-base text-black outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-500 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-500 sm:text-sm/6" placeholder="confirm password here."/>
                <button id="PasswordvisibleBtn"  class="absolute top-8 right-2"><i class="fa-solid fa-eye text-sm"></i></button>
            </div>
            <hr class="my-5">
            <button class="block mx-auto p-1 w-full mt-5 mb-7 rounded-md bg-blue-400 text-white hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">Reset Password</button>
            <a href="/auth/login" class="text-blue-500 text-sm mx-2 hover:text-blue-700 text-right block">Go back to login</a>
        </form>

    </div>

    <script>
        const newPassword = document.getElementById('new_password');
        const confirmPassword = document.getElementById('confirm_password');
        const passwordVisibleBtn = document.getElementById('PasswordvisibleBtn');

        function updateStyle(input, isValid) {
            input.classList.toggle('outline-red-500', !isValid);
            input.classList.toggle('outline-green-500', isValid);
        }

        newPassword.addEventListener('keyup', () => {
            if(newPassword.value.length < 8) {
                document.getElementById('newPasswordError').classList.remove('hidden');
                document.getElementById('newPasswordError').classList.add('block');

            } else {
                document.getElementById('newPasswordError').style.display = 'none';
            }
            updateStyle(newPassword, newPassword.value.length >= 8);
        });


        confirmPassword.addEventListener('keyup', () => {
            updateStyle(confirmPassword, newPassword.value === confirmPassword.value);
        });

        passwordVisibleBtn.addEventListener('click', (e) => {
            e.preventDefault();
            const type = confirmPassword.getAttribute('type') === 'password' ? 'text' : 'password';
            confirmPassword.setAttribute('type', type);
            passwordVisibleBtn.innerHTML = type === 'password' ? '<i class="fa-solid fa-eye text-sm"></i>' : '<i class="fa-solid fa-eye-slash text-sm"></i>';
        }); 
    </script>
  </body>
</html>
