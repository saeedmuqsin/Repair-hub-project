        <!DOCTYPE html>
        <html lang="en">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
            <link rel="stylesheet" href="{{ url_for('static', filename='css/FormStyle.css')}}">
            <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
            <title></title>
        </head>
        <body>
            <img src="{{ url_for('users.static', filename='images/brand-logo.png')}}" alt="" class="img-fluid logo">
            <h1 class="text-center header" >Fix Point</h1>

            {% for messages in get_flashed_messages() %}
                <div class="alert alert-warning alert-dismissible fade show" role="alert">
                    {{ messages }}
                    <button type="button" class="btn-close text-sm" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}

            <div class="register_container py-4">
                <h1 class="text-center text-light">Create Your Account</h1>
                <hr class="mx-5">
                <form action="/register" method="POST" class="pb-4 pt-2" enctype="multipart/form-data"> 
                    <div class="form-input-group">
                        <div class="mb-4 mx-1 input_group">
                            <label for="email" class="form-label">Full Name:</label>
                            <input type="text" class="form-control" id="full_name" name="full_name" placeholder="Enter your name">
                            <i class="bi bi-person-fill text-dark"></i>
                        </div>
                        <div class="mb-4 mx-1 input_group">
                            <label for="password" class="form-label">Email address:</label>
                            <input type="email" class="form-control" id="email" name="email" placeholder="your@example.com">
                            <i class="bi bi-envelope-fill text-dark"></i>
                        </div>
                    </div>

                    <div class="form-input-group">
                        <div class="mb-4 mx-1 input_group">
                            <label for="email" class="form-label">Tel-Number:</label>
                            <input type="text" class="form-control" id="phone-number" name="phone-number" placeholder="+233 *********">
                            <i class="bi bi-telephone-fill text-dark"></i>
                        </div>
                        <div class="mb-4 mx-1 input_group">
                            <label for="password" class="form-label">Password:</label>
                            <input type="password" class="form-control" id="password" name="password" placeholder="***********">
                            <i class="bi bi-lock-fill text-dark"></i>
                        </div>
                    </div>

                    <div class="form-input-group">
                        <div class="mb-4 mx-2 input_group w-50">
                            <label for="email" class="form-label">Gender:</label>
                            <select type="text" class="form-control w-100" id="gender" name="gender" placeholder="+12-5405-4030">
                                <option value="male">Male</option>
                                <option value="female">Female</option>
                                <option value="others">Others</option>
                            </select>
                            <i class="bi bi-chevron-down text-dark"></i>
                        </div>
                        <div class="mb-4 mx-2 input_group w-50">
                            <label for="role" class="form-label">Role:</label>
                            <select type="text" class="form-control w-100" id="role" name="role">
                                <option value="customer">Customer</option>
                                <option value="technician">Technician</option>
                            </select>
                            <i class="bi bi-chevron-down text-dark"></i>
                        </div>
                    </div>
                    <div class="form-input-group">
                        <div class="mb-4 mx-2 input_group w-100">
                            <label for="profile_picture" class="form-label">Profile Picture:</label>
                            <input class="form-control w-100" type="file" id="profile_picture" name="profile-picture" required>
                            <i class="bi bi-upload text-dark"></i>
                        </div>
                    </div>
                    

                    <button type="submit" class="btn btn-primary w-100 mt-3 ">Create Account</button>
                    <p class="text-center mt-3 mb-0">Already have an account?<a href="/login" class="text-no-decoration"> Login here</a></p>
                </form>
            </div>
            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
        </body>
        </html>
