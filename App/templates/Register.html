<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <title></title>
  </head>
  <body class="bg-gray-100 relative">
    {% for message in get_flashed_messages() %}
    <div
      id="alertMessage"
      class="flex items-center justify-between p-2 absolute border-r-4 border-white bg-blue-300 w-[440px] right-10 top-5 rounded-md"
    >
      <div class="flex items-center">
        <i class="fa-solid fa-circle-exclamation text-white"></i>
        <p class="text-sm text-base mx-2.5 text-white">{{ message }}</p>
      </div>

      <a href="#" class="text-white mx-2" id="close-btn"
        ><i class="fa-solid fa-xmark"></i
      ></a>
    </div>

    {% endfor %}

    <!-- Register -->
    <div class="w-[95%] md:w-1/2 lg:w-1/2 bg-white p-4 block mx-auto mt-12 mb-6.5 rounded-md">
      <h2 class="text-2xl mx-2.5 mt-4 font-medium">Create an account</h2>
      <p class="mb-3.5 mt[-10px] block text-sm text-gray-500 mx-3">
        You can create a new account on Fix-Point hub
      </p>
      <hr class="mt-[-5px]" />

      <form action="/auth/register" method="POST" enctype="multipart/form-data">
        <div class="grid grid-rows-2 grid-cols-2">
          <div class="block my-1 p-2">
            <label for="" class="mx-1.5">Username:</label>
            <input
              id="username"
              type="text"
              name="username"
              required
             
              class="block mx-1 my-1.5 w-full rounded-md bg-white/5 px-3 py-1.5 text-base text-black outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-500 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-500 sm:text-sm/6"
              placeholder="Type your username"
            />
          </div>

          <div class="block my-1 p-2">
            <label for="" class="mx-1.5">Email:</label>
            <input
              id="email"
              type="email"
              name="email"
              required
             
              class="block mx-1 my-1.5 w-full rounded-md bg-white/5 px-3 py-1.5 text-base text-black outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-500 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-500 sm:text-sm/6"
              placeholder="Type your email"
            />
          </div>

          <div class="block my-0.5 p-2 col-span-2">
            <label for="" class="mx-1.5">Phone number:</label>
            <input
              id="phone"
              type="text"
              name="phone-number"
              required
            
              class="block mx-1 my-1.5 w-full rounded-md bg-white/5 px-3 py-1.5 text-base text-black outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-500 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-500 sm:text-sm/6"
              placeholder="+1 234 567 890"
            />
          </div>

          <div class="block my-0.5 p-2 col-span-2">
            <label for="" class="mx-1.5">Password:</label>
            <input
              id="Password"
              type="password"
              name="password"
              required
              
              class="block mx-1 my-1.5 w-full rounded-md bg-white/5 px-3 py-1.5 text-base text-black outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-500 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-500 sm:text-sm/6"
              placeholder="*********"
            />
          </div>

          <div class="block my-1 p-2">
            <label for="" class="mx-1.5">Select Gender:</label>
            <select
              id="gender"
              name="gender"
              aria-label="gender"
              required
              class="col-start-1 row-start-1 w-full appearance-none rounded-md bg-white py-1.5 pr-7 pl-3 text-base text-gray-700 *:bg-white placeholder:text-gray-700 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-500 sm:text-sm/6 outline-1 mt-2 outline-gray-300"
            >
              <option value="male">Male</option>
              <option value="female">Female</option>
              <option value="others">Others</option>
            </select>
          </div>

          <div class="block my-1 p-2">
            <label for="" class="mx-1.5">Who are you?</label>
            <select
              id="role"
              name="role"
              aria-label="role"
              required
              class="col-start-1 row-start-1 w-full appearance-none rounded-md bg-white py-1.5 pr-7 pl-3 text-base text-gray-700 *:bg-white placeholder:text-gray-700 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-500 sm:text-sm/6 outline-1 mt-2 outline-gray-300"
            >
              <option value="customer">Customer</option>
              <option value="technician">Technician</option>
            </select>
          </div>

          <div class="col-span-2">
            <label class="block mx-2.5 my-5 text-sm font-medium text-gray-700">
              Profile Photo:
            </label>
            <input
              type="file"
              required
              name="profile-photo"
              class="my-2 outline-1 outline-gray-200  rounded-md  block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100"
            />
          </div>

          <button type="submit" class="p-2 col-span-2 my-5 bg-blue-400 text-white rounded-md">Register now</button>
        </div>
    </form>
    <a href="/auth/login" class="text-sm text-base text-gray-400 mt-4.5 text-center block" >Have an account already? <span class="text-blue-400">Login account</span></a>
    </div>
  </body>
</html>
