<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <title></title>
  </head>
  <body class="bg-gray-100">
    <!-- flash an alert message on top of the page -->

    <div class="block -mb-2.5">
    {% for message in get_flashed_messages() %}
        <div class="flex items-center bg-blue-200 p-2 rounded-md w-[90%] lg:w-2/5 md:w-2/5 mx-auto mt-5 text-white" id="alertMessage">
            <div class="flex-shrink-0">
                <i class="fa-solid fa-circle-check text-white"></i>
            </div>
            <div class="ml-3 text-white">
                <p class="text-sm text-white">{{ message }}</p>
            </div>
            <button id="close-btn" class="ml-auto mx-2 -my-1.5 bg-blue-200 text-gray-500 rounded-md focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-blue-200 focus:ring-gray-500">
                <span class="sr-only">Dismiss</span>
                <i class="fa-solid fa-xmark text-white"></i>
            </button>

        </div>
        {% endfor %}
    </div>

    <!-- login container -->
    <div
      class="w-[90%] h-[520px] lg:w-2/5 bg-white p-4 mx-auto mt-20 md:mt-10 lg:mt-5.5 pb-6 rounded-md"
    >
      <div class="block pt-5">
        <img
          src="{{ url_for('users.static', filename='images/brand-logo.png') }}"
          class="mt-2 size-12 rounded-md mx-auto bg-gray-50"
          alt=""
        />
        <h2
          class="font-normal text-lg md:text-2xl lg:text-2xl mt-4 mb-2 text-center"
        >
          Welcome back to
          <span class="font-medium text-blue-300">Fix-Point hub</span>
        </h2>
      </div>
      <form action="/auth/login" method="POST" class="p-5 my-3">
        <!-- Email input -->
        <div class="block my-5">
          <label for="" class="mx-1">Email</label>
          <input
            id="email"
            type="email"
            name="email"
            required
            class="block mx-1 my-1.5 w-full rounded-md bg-white/5 px-3 py-1.5 text-base text-black outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-500 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-500 sm:text-sm/6"
            placeholder="Type your email"
          />
        </div>

        <div class="block my-5">
          <label for="" class="mx-1">Password</label>
          <input
            id="password"
            type="password"
            name="password"
            required
            autocomplete="family-name"
            class="block mx-1 my-1.5 w-full rounded-md bg-white/5 px-3 py-1.5 text-base text-black outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-500 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-500 sm:text-sm/6"
            placeholder="Type your password"
          />
        </div>

        <div class="flex items-center justify-end">
          <a
            href="/forget_password"
            class="text-base text-sm font-medium underline text-gray-500"
            >Forgot password?</a
          >
        </div>
        <button
          type="submit"
          class="block bg-blue-400 p-2 w-full my-3.5 text-white text-base rounded-md"
        >
          Login
        </button>
        <a
          href="/auth/register"
          class="text-sm text-base text-gray-400 mt-4.5 text-center block"
          >Don't have an account?
          <span class="text-blue-400">Create account</span></a
        >
      </form>
    </div>

    <!-- Custom js for login page -->
    <script>
      const alertComponent = document.getElementById("alertMessage");
      const closeBtn = document.getElementById("close-btn");

      closeBtn.addEventListener("click", () => {
        alertComponent.classList.remove("flex");
        alertComponent.classList.add("hidden");
      });
    </script>
  </body>
</html>
