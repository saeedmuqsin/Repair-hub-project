<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <title></title>
  </head>
  <body class="bg-gray-200">

    <!-- Password Reset  -->
    <div class="container w-[95%] lg:w-2/5 md:w-2/5 bg-white p-3 mx-auto mt-25">
        <h2 class="mx-2 text-xl font-medium">Password Reset</h2>
        <p class="mx-2 text-gray-600">Please enter your email address to reset your password.</p>

        <form action="/forget_password" method="POST">
            <div class="block mt-10 mb-2.5 w-full">
                <label for="email" class="block mx-2 text-sm font-medium text-gray-700">Email *</label>
                <input id="email" type="email" name="email" required  class="block mx-1 my-1.5 w-full rounded-md bg-white/5 px-3 py-1.5 text-base text-black outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-500 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-500 sm:text-sm/6" placeholder="Type your email"/>
            </div>

            <button class="block mx-auto p-1 w-full mt-5 rounded-md bg-blue-400 text-white hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">Send reset link</button>
        </form>
        <hr class="my-5">

        <div class="flex items-center justify-end gap-3">
            <a href="/auth/login" class="text-gray-500 text-sm font-normal hover:text-gray-700">Login</a>
            <a href="/auth/register" class="text-gray-500 text-sm font-normal hover:text-gray-700">Register</a>
        </div>
    </div>

  </body>
</html>
