{% extends "technicians.base.html"%} {% block head %} {% endblock %} {% block
content %}

<div class="container p-5 bg-white w-full mx-auto overflow-y-scroll h-[85vh] pb-10">
  <form action="/technician/settings" method="POST" enctype="multipart/form-data" class="p-6">
    <!-- Profile Photo -->
    <div class="flex items-center justify-between">
      <div class="flex items-center space-x-6">
        <img src="data:image/png;base64,{{ current_user.User_ProfilePhoto() }}" alt="{{ current_user.name }}"
          class="w-20 h-20 rounded-full object-cover" />

        <div>
          <label class="block text-sm font-medium text-gray-700">
            Change Profile Photo
          </label>
          <input type="file" name="profile-photo"
            class="mt-2 block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100" />
        </div>
      </div>
      <div class="flex items-center space-x-6">
        <img src="data:image/png;base64,{{ profile.Display_photo() }}" alt="{{ current_user.name }}"
          class="w-20 h-20 rounded-full object-cover" />

        <div>
          <label class="block text-sm font-medium text-gray-700">
            Change Brand Profile
          </label>
          <input type="file" name="brand-photo"
            class="mt-2 block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100" />
        </div>
      </div>

    </div>
    <hr class="my-3" />

    <!-- Personal info -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-6">
      <!-- Example Form Field -->
      <div>
        <label class="block text-sm font-medium text-gray-700">
          Username
        </label>
        <input type="text" name="username" value="{{ current_user.username }}"
          class="mt-1 w-full border rounded-md p-2 focus:ring-2 focus:ring-blue-500" required>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">
          Email
        </label>
        <input type="email" name="email" value="{{ current_user.email }}"
          class="mt-1 w-full border rounded-md p-2 focus:ring-2 focus:ring-blue-500" required>
      </div>
    </div>

    <!-- Phone number -->
    <div class="mt-6 mb-3">
      <label class="block text-sm font-medium text-gray-700">
        Phone Number
      </label>
      <input type="text" name="phone-number" value="{{ current_user.phone_number }}"
        class="mt-1 w-full border rounded-md p-2 focus:ring-2 focus:ring-blue-500" required>
    </div>

    <h2 class="text-xl font-medium mt-10">Business Brand Info.</h2>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-6">
      <!-- Example Form Field -->
      <div>
        <label class="block text-sm font-medium text-gray-700">
          Brand Name:
        </label>
        <input type="text" name="brand-name" value="{{ profile.name }}"
          class="mt-1 w-full border rounded-md p-2 focus:ring-2 focus:ring-blue-500" required>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">
          Brand Location:
        </label>
        <input type="text" name="brand-location" value="{{ profile.location }}"
          class="mt-1 w-full border rounded-md p-2 focus:ring-2 focus:ring-blue-500" required>
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-10">
      <!-- Example Form Field -->
      <div>
        <label class="block text-sm font-medium text-gray-700">
          Services Offered:
        </label>
        <select name="services_offered" class="w-full border rounded-lg p-3 focus:ring-2 focus:ring-blue-500">
          <option value="" {% if not profile or not profile.services_offered %}selected{% endif %}>Select service</option>
          <option value="Phone Repair" {% if profile and profile.services_offered == 'Phone Repair' %}selected{% endif %}>Phone Repair</option>
          <option value="Laptop Repair" {% if profile and profile.services_offered == 'Laptop Repair' %}selected{% endif %}>Laptop Repair</option>
          <option value="Fridge Repair" {% if profile and profile.services_offered == 'Fridge Repair' %}selected{% endif %}>Fridge Repair</option>
          <option value="TV Repair" {% if profile and profile.services_offered == 'TV Repair' %}selected{% endif %}>TV Repair</option>
          <option value="General Electronics" {% if profile and profile.services_offered == 'General Electronics' %}selected{% endif %}>General Electronics</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">
          Bio:
        </label>
       <textarea rows="4" 
                        class="w-full border rounded-lg p-3 focus:ring-2 focus:ring-blue-500 focus:outline-none" name="description">{{ profile.description }}</textarea>
      </div>
    </div>

    <hr class="mt-5 mb-3">

    <div class="flex justify-end mt-6">
      <button type="submit" disabled
        class="disabled:bg-gray-400 text-sm bg-blue-400 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded">
        Save Changes
      </button>

      <a href="/technician/dashboard?profile={{ current_user.id }}"
        class="mx-5 text-sm bg-gray-300 hover:bg-gray-400 text-gray-700 font-medium py-2 px-4 rounded">
        Cancel
      </a>
  </form>
</div>
{% endblock %} 
{% block scripts %} 
<script>

  const form = document.querySelector('form');
  const submitButton = document.querySelector('button[type="submit"]');
  const inputs = form.querySelectorAll('input');
  const selects = form.querySelectorAll('select');

  function enableButton() {
    submitButton.disabled = false;
  }

  inputs.forEach(input => {
    input.addEventListener('click', enableButton);
    input.addEventListener('keyup', enableButton);
    input.addEventListener('keydown', enableButton);
  });

  selects.forEach(select => {
    select.addEventListener('click', enableButton);
    select.addEventListener('keyup', enableButton);
    select.addEventListener('keydown', enableButton);
  })
</script>
{% endblock %}
