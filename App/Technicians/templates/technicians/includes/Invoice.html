<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Invoice</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .header { display: flex; justify-content: space-between; }
        .title { font-size: 24px; font-weight: bold; }
        .section { margin-top: 20px; }
        .table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .table th, .table td {
            border: 1px solid #ddd;
            padding: 10px;
        }
        .total { text-align: right; font-size: 18px; margin-top: 20px; }
        .brand-logo {
          height: 40%;
          width: 20%;
        }
    </style>
</head>
<body>

<div class="header">
    <div>
        <img class="brand-logo" src="/App/Users/static/users/images/brand-logo.png" alt="">
        <div class="title">Fix-Point Hub</div>
        <p>Booking #: {{ booking.id }} </p>
        <p>Date: {{ booking.completed_date }}</p>
    </div>

    <div>
        <p><strong>Customer:</strong> {{ booking.user.username }}</p>
        <p><strong>Email:</strong> {{ booking.user.phone_number }}</p>
    </div>
</div>

<div class="section">
    <h3>Service Details</h3>
    <table class="table">
        <tr>
            <th>Description</th>
            <th>Amount</th>
        </tr>
        <tr>
            <td>Service Cost</td>
            <td>Gh₵ {{ service_cost }}</td>
        </tr>
        <tr>
            <td>Parts Cost</td>
            <td>Gh₵ {{ parts_cost }}</td>
        </tr>
    </table>
</div>

<div class="total">
    <strong>Total: Gh₵ {{ total_cost }}</strong>
</div>

</body>
</html>
