<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title></title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


  {% block head %}{% endblock %}
</head>

<body class="bg-gray-100">

  <div class="min-h-screen flex">

    <!-- Sidebar -->
    <aside id="sidebar"
      class="w-64 bg-white text-white shadow-lg fixed md:static inset-y-0 left-0 transform -translate-x-full md:translate-x-0 transition-transform duration-300 z-40">
      <div class="px-6 py-3 border-b border-gray-100 flex items-center justify-between">
        <div class="flex items-center">
          <img src="{{ url_for('users.static', filename='images/brand-logo.png')}}" alt="" class="size-12 mx-1">
          <h2 class="text-gray-700 text-lg mt-1 font-medium">Fix-Point Hub</h2>
        </div>
        <button id="close-sidebar" class="md:hidden text-gray-600 text-lg mt-1">
          <i class="fa-solid fa-times"></i>
        </button>
      </div>

      <nav class="p-4 space-y-2 text-sm">
        <a href="/technician/dashboard?profile={{current_user.id}}"
          class="block text-gray-600 bg-gray-50 p-2 rounded-lg hover:bg-blue-300 hover:text-white transition"><i
            class="fa-solid fa-house ml-2 mr-1"></i> Dashboard</a>

        <div class="relative group">
          <button class="w-full text-left text-gray-600 p-2 rounded-lg hover:bg-blue-300 hover:text-white transition flex items-center justify-between toggle-menu" data-menu="bookings-menu">
            <span><i class="fa-solid fa-scroll ml-2 mr-1"></i>Bookings</span>
            <i class="fa-solid fa-chevron-down text-sm"></i>
          </button>
          <div id="bookings-menu" class="hidden py-3 px-2 absolute left-0 mt-0 w-full bg-white border border-gray-200 rounded-lg shadow-lg z-10">
            <a href="/technician/active_bookings?profile={{ current_user.id }}" class="block rounded-md text-gray-600 p-2.5 hover:bg-blue-300 hover:text-white transition text-sm">Accept Bookings</a>
            <a href="/technician/generate_invoice?profile={{ current_user.id }}" class="block rounded-md text-gray-600 p-2.5 hover:bg-blue-300 hover:text-white transition text-sm">Generate Invoice</a>
            <a href="/technician/history?profile={{ current_user.id }}" class="block rounded-md text-gray-600 p-2.5 hover:bg-blue-300 hover:text-white transition text-sm">History</a>
          </div>
        </div>

        <a href="/technician/settings" class="block text-gray-600 p-2 rounded-lg hover:bg-blue-300 hover:text-white transition"><i
            class="fa-solid fa-user-gear ml-2 mr-2"></i>Options</a>
      </nav>
    </aside>

    <!-- Mobile Toggle Button -->

    <!-- Overlay for mobile -->
    <div id="sidebar-overlay" class="md:hidden fixed inset-0 bg-black opacity-50 hidden z-30"></div>

    <main class="flex-1 h-screen overflow-y-auto">
      <!-- Main Content -->
      <!-- Mobile Toggle Button -->
      <!-- Top Header of the page -->
      <div class="flex items-center justify-between p-4 border-b border-gray-200 w-full relative">
        <p class="hidden md:block lg:block text-lg md:text-xl lg:text-2xl font-medium">Hello, <span
            class="text-blue-300">{{ current_user.username }}!</span></p>

        <button id="toggle-sidebar" class="block md:hidden text-gray-600 text-2xl">
          <i class="fa-solid fa-bars"></i>
        </button>

        <div class="flex items-center space-x-4 md:mx-5 lg:mx-7">
          <img src="data:image/png;base64,{{ current_user.User_ProfilePhoto() }}" alt="{{ current_user.name }}"
            class="size-10 rounded-full block float-right" />
          <a href="{{ url_for('logout') }}"
            class="block text-gray-600 pl-3 text-blue-300 border-gray-500 border-l hover:text-blue-300 transition duration-300">
            <i class="fa-solid fa-arrow-right-from-bracket"></i>
          </a>
        </div>
      </div>
      {% block content %}{% endblock %}
    </main>

  </div>

  <script>
    const sidebar = document.getElementById('sidebar');
    const toggleBtn = document.getElementById('toggle-sidebar');
    const closeBtn = document.getElementById('close-sidebar');
    const overlay = document.getElementById('sidebar-overlay');

    toggleBtn.addEventListener('click', () => {
      sidebar.classList.remove('-translate-x-full');
      overlay.classList.remove('hidden');
    });

    closeBtn.addEventListener('click', () => {
      sidebar.classList.add('-translate-x-full');
      overlay.classList.add('hidden');
    });

    overlay.addEventListener('click', () => {
      sidebar.classList.add('-translate-x-full');
      overlay.classList.add('hidden');
    });

    // Dropdown Menu Logic
    document.querySelectorAll('.toggle-menu').forEach(button => {
      button.addEventListener('click', () => {
        const menuId = button.getAttribute('data-menu');
        const menu = document.getElementById(menuId);
        menu.classList.toggle('hidden');
      });
    });
  </script>

  {% block scripts %}{% endblock %}
</body>

</html>
